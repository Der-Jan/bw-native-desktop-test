[workspace]
members = ["crates/*", "bitwarden_license/*", "tools/*"]
default-members = ["crates/*", "bitwarden_license/*"]
resolver = "3"
exclude = ["vendor/bitwarden-core", "vendor/iced-wgpu", "tools/egui-demo"]

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-auth = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-collections = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-exporters = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-fido = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-generators = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-logging = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-pm = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-send = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-ssh = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "a13b4c4e1fa3685280241f417920fd19d7ef24a6" }

iced = { git = "https://github.com/iced-rs/iced", rev = "0d12e964da8c3f0f7a02d3d731e3187eecfe5779", default-features = false }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "0d12e964da8c3f0f7a02d3d731e3187eecfe5779" }

# Compile all dependencies with some optimizations when building this crate on debug
# This slows down clean builds by about 50%, but the resulting binaries can be orders of magnitude faster
# As clean builds won't occur very often, this won't slow down the development process
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
strip = "debuginfo"
# `lto = "fat"` trims another ~5% but roughly doubles link time.
lto = "thin"
# ~30% smaller binary. But worse performance when not using GPU acceleration.
# opt-level = "z"
# ~20% smaller binary, but turns every `std::panic::catch_unwind` into a hard process abort.
# panic = "abort"

# Enable optimization for the bitwarden-crypto crate. This will increase the binary size slightly (~0.1MB),
# but it will more aggressively inline functions. This will help us avoid extra stack copies of keys and
# other sensitive values being left behind without cleanup.
[profile.release.package.bitwarden-crypto]
opt-level = 3

[patch."https://github.com/bitwarden/sdk-internal"]
bitwarden-core = { path = "vendor/bitwarden-core" }

[patch."https://github.com/iced-rs/iced"]
iced_wgpu = { path = "vendor/iced-wgpu" }
