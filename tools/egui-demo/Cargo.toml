[package]
name = "bw-egui-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
fontdb = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Keep the comparison independent of Iced's pinned web/wasm dependency graph.
[workspace]
resolver = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
