[package]
name = "iced_wgpu"
description = "A renderer for iced on top of wgpu"
version = "0.15.0-dev"
edition = "2024"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]

[workspace]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["wgpu/default"]
geometry = ["iced_graphics/geometry", "lyon"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg", "resvg/text"]
web-colors = ["iced_graphics/web-colors"]
webgl = ["wgpu/webgl"]
strict-assertions = []

[dependencies]
iced_debug = { git = "https://github.com/iced-rs/iced", rev = "0d12e964da8c3f0f7a02d3d731e3187eecfe5779" }
iced_graphics = { git = "https://github.com/iced-rs/iced", rev = "0d12e964da8c3f0f7a02d3d731e3187eecfe5779" }

bitflags = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
glam = "0.25"
cryoglyph = { git = "https://github.com/iced-rs/cryoglyph.git", rev = "53ba3e879539d19ed8162942126a977ec896cc3b" }
guillotiere = "0.6"
log = "0.4"
rustc-hash = "2.0"
thiserror = "2"
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }

lyon = { version = "1.0", optional = true }

resvg = { version = "0.45", optional = true }
